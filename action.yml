#
# action.yml — Validate DEED Manifests GitHub Action
# Scans repository for .deed (and superseded .a2ml) files and validates
# structure, required fields, SPDX headers, and attestation blocks.

name: 'Validate DEED Manifests'
description: >-
  Scan and validate .deed manifest files against the DEED grammar.
  Checks identity (:canonical-name), version (:schema-version),
  SPDX headers, and attestation block structure. Also reads the
  superseded .a2ml extension.
author: 'Jonathan D.A. Jewell'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: >-
      Directory path to scan for .deed files (and superseded .a2ml).
      Defaults to the repository root.
    required: false
    default: '.'
  strict:
    description: >-
      When true, warnings are promoted to errors and the action
      will fail on any validation issue. Defaults to false.
    required: false
    default: 'false'

outputs:
  files-scanned:
    description: 'Number of DEED-family files scanned'
    value: ${{ steps.validate.outputs.files_scanned }}
  errors:
    description: 'Number of validation errors found'
    value: ${{ steps.validate.outputs.errors }}
  warnings:
    description: 'Number of validation warnings found'
    value: ${{ steps.validate.outputs.warnings }}

runs:
  using: 'composite'
  steps:
    - name: Validate DEED manifests
      id: validate
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        "${GITHUB_ACTION_PATH}/validate-a2ml.sh"
